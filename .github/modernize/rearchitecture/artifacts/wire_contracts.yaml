contracts:
  - name: auth-cookie-api
    unit: auth-api
    type: rest
    stability: frozen
    source_loc: "sicat-backend/src/routes/auth.routes.js:6"
    contract:
      method: "POST/GET"
      path: "/api/auth/login, /api/auth/me, /api/auth/logout"
      request: "login {correo, contrasena}; me sin body"
      response: "usuario JSON; login/logout message"
      error: "401 credenciales/token; 403 token inválido"
      auth: "HttpOnly auth_token cookie"
    target_contract:
      method: "Mantener endpoints y cookie auth_token"
      notes: "El frontend usa credentials/include."
    semantic_divergence: []
  - name: resource-rest-api
    unit: global
    type: rest
    stability: frozen
    source_loc: "sicat-backend/src/index.js:54"
    contract:
      method: "GET/POST/PUT/PATCH/DELETE"
      path: "/api/{auth,asignaciones,categorias,departamentos,compras,empresas,facturas,inventario,pedidos,productos,proveedores,tickets,usuarios}"
      request: "JSON o multipart según factura"
      response: "JSON de entidad/lista"
      error: "401/403 auth; 404 recurso; 409 conflicto; 500 error"
      auth: "JWT cookie para rutas protegidas"
    target_contract:
      method: "Preservar rutas, verbos, payloads y estados usados por la SPA"
      notes: "Los detalles por recurso están en routes/*.routes.js."
    semantic_divergence: []
  - name: invoice-files
    unit: facturas-api
    type: file
    stability: frozen
    source_loc: "sicat-backend/src/routes/factura.routes.js:10"
    contract:
      method: "multipart/form-data"
      path: "/api/facturas y /api/facturas/:id/complementos"
      request: "archivo_pdf, archivo_xml o archivo; máximo 25 MB; PDF/XML"
      response: "Factura/complemento JSON o URL firmada"
      error: "400 archivo no permitido; 401/403; errores de Storage"
      auth: "JWT y rol admin en escrituras"
    target_contract:
      method: "Conservar nombres multipart, límite 25 MB y URLs firmadas"
      notes: "Supabase Storage es parte del contrato observable."
    semantic_divergence: []
  - name: events-sse
    unit: events-api
    type: rest
    stability: frozen
    source_loc: "sicat-backend/src/index.js:66"
    contract:
      method: "GET"
      path: "/api/events/stream"
      request: "sin body"
      response: "text/event-stream; connected, ticket.* y material-request.*"
      error: "401 si falta cookie"
      auth: "JWT cookie; además filtra por departamento sistemas"
    target_contract:
      method: "Mantener SSE, heartbeat de 25 s y nombres de eventos"
      notes: "El bus es proceso-local."
    semantic_divergence: []
