user_intent:
  raw_request: "Describir el proyecto completo para que otro LLM lo entienda."
  inferred_acceptance:
    - "Documentar la arquitectura, stack, datos, entradas, contratos y relaciones entre módulos."
    - "No cambiar el código funcional."
  cleanup_required: false
strategy: minimal_runtime
runtime_reachable:
  - sicat-frontend/src/main.jsx
  - sicat-backend/src/index.js
  - sicat-database/database.sql
must_rewrite: []
copy_as_is:
  - sicat-frontend/src
  - sicat-backend/src
  - sicat-database
legacy_allowed_to_remain:
  - sicat-frontend/dist
  - sicat-frontend/node_modules
  - sicat-backend/node_modules
defer_cleanup:
  - "No se solicita limpieza ni migración; los artefactos generados quedan fuera del análisis."
full_rewrite_reason: null
implementation_rule: >
  Este análisis es documental. No hay alcance de reescritura; cualquier cambio posterior
  debe partir del código fuente y de los contratos globales, no de node_modules ni dist.
