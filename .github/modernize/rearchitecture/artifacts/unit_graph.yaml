units:
  - name: frontend-spa
    trigger: page
    trigger_detail: "React Router routes from src/App.jsx"
    source_anchors:
      - path: sicat-frontend/src/main.jsx
        line: 1
      - path: sicat-frontend/src/App.jsx
        line: 1
      - path: sicat-frontend/src/context/AuthContext.jsx
        line: 1
      - path: sicat-frontend/src/components
        line: 1
    exported_signature:
      - method: "React App() -> JSX.Element"
        source_loc: "sicat-frontend/src/App.jsx:24"
        stability: frozen
    dynamic_entrypoints:
      - target: "React components loaded by route declarations"
        mechanism: convention
        source_loc: "sicat-frontend/src/App.jsx:29"
    depends_on:
      - unit: auth-api
        via: "Axios/fetch /auth/*"
      - unit: tickets-api
        via: "tickets and SSE APIs"
      - unit: facturas-api
        via: "facturas and complements APIs"
    shared_refs: []
  - name: auth-api
    trigger: api
    trigger_detail: "POST /api/auth/login; POST /api/auth/registrar; POST /api/auth/logout; GET /api/auth/me"
    source_anchors:
      - path: sicat-backend/src/routes/auth.routes.js
        line: 1
      - path: sicat-backend/src/controllers/auth.controller.js
        line: 1
    exported_signature:
      - method: "HTTP auth endpoints -> JSON and auth_token cookie"
        source_loc: "sicat-backend/src/routes/auth.routes.js:6"
        stability: frozen
    dynamic_entrypoints: []
    depends_on: []
    shared_refs:
      - module: backend-auth-middleware
        used_fields: [verificarToken, verificarRol]
      - module: backend-db-pool
        used_fields: [query]
  - name: asignaciones-api
    trigger: api
    trigger_detail: "GET/POST /api/asignaciones; PATCH /api/asignaciones/:id/devolver"
    source_anchors: [{path: sicat-backend/src/routes/asignacion.routes.js, line: 1}, {path: sicat-backend/src/controllers/asignacion.controller.js, line: 1}]
    exported_signature: [{method: "assignment CRUD/status endpoints -> JSON", source_loc: "sicat-backend/src/routes/asignacion.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on:
      - unit: inventario-api
        via: "inventory rows"
      - unit: pedidos-api
        via: "optional id_pedido"
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-event-bus, used_fields: [publish]}]
  - name: categorias-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/categorias"
    source_anchors: [{path: sicat-backend/src/routes/categoria.routes.js, line: 1}, {path: sicat-backend/src/controllers/categoria.controller.js, line: 1}]
    exported_signature: [{method: "category CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/categoria.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: []
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: departamentos-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/departamentos"
    source_anchors: [{path: sicat-backend/src/routes/departamento.routes.js, line: 1}, {path: sicat-backend/src/controllers/departamento.controller.js, line: 1}]
    exported_signature: [{method: "department CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/departamento.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: empresas-api, via: "id_empresa foreign key"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: compras-api
    trigger: api
    trigger_detail: "GET/POST /api/compras and GET /api/compras/:id"
    source_anchors: [{path: sicat-backend/src/routes/compra.routes.js, line: 1}, {path: sicat-backend/src/controllers/compra.controller.js, line: 1}]
    exported_signature: [{method: "purchase endpoints -> JSON", source_loc: "sicat-backend/src/routes/compra.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: proveedores-api, via: "id_proveedor"}, {unit: productos-api, via: "id_producto"}, {unit: empresas-api, via: "id_empresa"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: empresas-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/empresas"
    source_anchors: [{path: sicat-backend/src/routes/empresa.routes.js, line: 1}, {path: sicat-backend/src/controllers/empresa.controller.js, line: 1}]
    exported_signature: [{method: "company CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/empresa.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: []
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: facturas-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/facturas and complement endpoints"
    source_anchors: [{path: sicat-backend/src/routes/factura.routes.js, line: 1}, {path: sicat-backend/src/controllers/factura.controller.js, line: 1}]
    exported_signature: [{method: "invoice/file/payment endpoints -> JSON or signed URL", source_loc: "sicat-backend/src/routes/factura.routes.js:37", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: compras-api, via: "invoice purchase relation"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-storage, used_fields: [upload, signedUrl]}, {module: backend-db-pool, used_fields: [query]}]
  - name: inventario-api
    trigger: api
    trigger_detail: "GET/POST/PATCH/DELETE /api/inventario and GET /api/inventario/alertas"
    source_anchors: [{path: sicat-backend/src/routes/inventario.routes.js, line: 1}, {path: sicat-backend/src/controllers/inventario.controller.js, line: 1}]
    exported_signature: [{method: "inventory endpoints -> JSON", source_loc: "sicat-backend/src/routes/inventario.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: productos-api, via: "id_producto"}, {unit: departamentos-api, via: "id_departamento"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-event-bus, used_fields: [publish]}]
  - name: pedidos-api
    trigger: api
    trigger_detail: "GET/POST /api/pedidos; PATCH /api/pedidos/:id/atender"
    source_anchors: [{path: sicat-backend/src/routes/pedido.routes.js, line: 1}, {path: sicat-backend/src/controllers/pedido.controller.js, line: 1}]
    exported_signature: [{method: "material request endpoints -> JSON", source_loc: "sicat-backend/src/routes/pedido.routes.js:8", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: inventario-api, via: "stock"}, {unit: departamentos-api, via: "requesting department"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken]}, {module: backend-event-bus, used_fields: [publish]}]
  - name: productos-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/productos"
    source_anchors: [{path: sicat-backend/src/routes/producto.routes.js, line: 1}, {path: sicat-backend/src/controllers/producto.controller.js, line: 1}]
    exported_signature: [{method: "product CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/producto.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: categorias-api, via: "id_categoria"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: proveedores-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/proveedores"
    source_anchors: [{path: sicat-backend/src/routes/proveedor.routes.js, line: 1}, {path: sicat-backend/src/controllers/proveedor.controller.js, line: 1}]
    exported_signature: [{method: "supplier CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/proveedor.routes.js:6", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: []
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: tickets-api
    trigger: api
    trigger_detail: "GET/POST /api/tickets; PATCH /api/tickets/:id/estado"
    source_anchors: [{path: sicat-backend/src/routes/ticket.routes.js, line: 1}, {path: sicat-backend/src/controllers/ticket.controller.js, line: 1}]
    exported_signature: [{method: "ticket endpoints -> JSON", source_loc: "sicat-backend/src/routes/ticket.routes.js:8", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: auth-api, via: "req.usuario"}, {unit: departamentos-api, via: "id_departamento"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken]}, {module: backend-event-bus, used_fields: [publish]}]
  - name: usuarios-api
    trigger: api
    trigger_detail: "GET/POST/PUT/DELETE /api/usuarios"
    source_anchors: [{path: sicat-backend/src/routes/usuario.routes.js, line: 1}, {path: sicat-backend/src/controllers/usuario.controller.js, line: 1}]
    exported_signature: [{method: "user CRUD endpoints -> JSON", source_loc: "sicat-backend/src/routes/usuario.routes.js:8", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: departamentos-api, via: "id_departamento"}]
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken, verificarRol]}, {module: backend-db-pool, used_fields: [query]}]
  - name: events-api
    trigger: api
    trigger_detail: "GET /api/events/stream (SSE)"
    source_anchors: [{path: sicat-backend/src/controllers/events.controller.js, line: 1}, {path: sicat-backend/src/services/eventBus.js, line: 1}]
    exported_signature: [{method: "SSE stream -> text/event-stream", source_loc: "sicat-backend/src/index.js:66", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: []
    shared_refs: [{module: backend-auth-middleware, used_fields: [verificarToken]}, {module: backend-event-bus, used_fields: [eventBus, publish]}]
